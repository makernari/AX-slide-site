<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BLOOM BITE 캠페인 카피 점검기</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#35170a;background:#fff2e9}
    body{max-width:820px;margin:0 auto;padding:32px 18px}
    main{background:#fff;border-radius:24px;padding:28px;box-shadow:0 16px 40px #7c2d1220}
    label{display:block;font-weight:700;margin:16px 0 6px}
    select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d7aa91;border-radius:12px;font:inherit}
    textarea{min-height:150px;resize:vertical}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    button{border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer}
    #check{background:#c2410c;color:#fff} #reset{background:#f7e5dc}
    #result{margin-top:20px;padding:18px;border-radius:16px;background:#fff7f2;white-space:pre-wrap}
    @media(max-width:520px){main{padding:20px}.actions button{flex:1}}
  </style>
</head>
<body>
  <main>
    <h1>BLOOM BITE 캠페인 카피 점검기</h1>
    <p>가상 브랜드 카피만 사용합니다. 목표·대상·메시지와 금지 표현을 확인하세요.</p>
    <label for="channel">채널</label>
    <select id="channel"><option>Instagram</option><option>Blog</option><option>YouTube</option></select>
    <label for="input">카피 초안</label>
    <textarea id="input" maxlength="600" placeholder="예: 목표..., 대상..., 메시지..."></textarea>
    <div class="actions"><button id="check" type="button">점검하기</button><button id="reset" type="button">초기화</button></div>
    <div id="result" aria-live="polite">결과가 여기에 표시됩니다.</div>
  </main>
  <script>
    const criteria = ['목표','대상','메시지'];
    const banned = ['무조건','최고','100%'];
    const input = document.querySelector('#input');
    const result = document.querySelector('#result');
    document.querySelector('#check').addEventListener('click', () => {
      const value = input.value.trim();
      if (!value) { result.textContent = '입력 필요: 카피 초안을 작성하세요.'; return; }
      const checks = criteria.map((item) => (value.includes(item) ? '확인: ' : '확인 필요: ') + item);
      const risks = banned.filter((item) => value.includes(item));
      result.textContent = '채널: ' + document.querySelector('#channel').value + '\n' + checks.join('\n') + '\n금지 표현: ' + (risks.join(', ') || '없음');
    });
    document.querySelector('#reset').addEventListener('click', () => {
      input.value = ''; result.textContent = '결과가 여기에 표시됩니다.'; input.focus();
    });
    // TODO(M08-D02): 실시간 글자 수와 채널별 권장 길이 상태를 추가하세요.
  </script>
</body>
</html>
