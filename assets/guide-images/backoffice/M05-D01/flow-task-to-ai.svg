<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">경영지원 업무 문제를 AI 작업으로 바꾸는 흐름</title>
  <desc id="desc">업무 문제, 비식별 입력, AI 작업, 검토 가능한 초안, 사람 검증의 다섯 단계를 보여주는 설명용 흐름도</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#64748b"/></marker></defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="90" y="96" font-family="Arial, Noto Sans KR, sans-serif" font-size="28" fill="#64748b">설명용 개념도 · 실제 UI 아님</text>
  <text x="90" y="165" font-family="Arial, Noto Sans KR, sans-serif" font-size="54" font-weight="700" fill="#0f172a">업무 문제를 실행 가능한 AI 작업으로 바꾸기</text>
  <g font-family="Arial, Noto Sans KR, sans-serif">
    <g transform="translate(70 300)"><rect width="260" height="260" rx="26" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/><text x="130" y="70" text-anchor="middle" font-size="28" font-weight="700" fill="#9a3412">1. 업무 문제</text><text x="130" y="130" text-anchor="middle" font-size="23" fill="#334155">무엇이 불편한가?</text><text x="130" y="178" text-anchor="middle" font-size="22" fill="#334155">예: 제출 항목 누락</text></g>
    <g transform="translate(370 300)"><rect width="260" height="260" rx="26" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="130" y="70" text-anchor="middle" font-size="28" font-weight="700" fill="#1e3a8a">2. 입력자료</text><text x="130" y="130" text-anchor="middle" font-size="23" fill="#334155">무엇을 줄 것인가?</text><text x="130" y="178" text-anchor="middle" font-size="22" fill="#334155">비식별 사실만</text></g>
    <g transform="translate(670 300)"><rect width="260" height="260" rx="26" fill="#f5f3ff" stroke="#7c3aed" stroke-width="4"/><text x="130" y="70" text-anchor="middle" font-size="28" font-weight="700" fill="#4c1d95">3. AI 작업</text><text x="130" y="130" text-anchor="middle" font-size="23" fill="#334155">요약·구조화·초안</text><text x="130" y="178" text-anchor="middle" font-size="22" fill="#334155">작업 동사로 쓰기</text></g>
    <g transform="translate(970 300)"><rect width="260" height="260" rx="26" fill="#ecfeff" stroke="#0891b2" stroke-width="4"/><text x="130" y="70" text-anchor="middle" font-size="28" font-weight="700" fill="#164e63">4. 결과 초안</text><text x="130" y="130" text-anchor="middle" font-size="23" fill="#334155">검토 가능한 형식</text><text x="130" y="178" text-anchor="middle" font-size="22" fill="#334155">확인 필요 표시</text></g>
    <g transform="translate(1270 300)"><rect width="260" height="260" rx="26" fill="#ecfdf5" stroke="#059669" stroke-width="4"/><text x="130" y="70" text-anchor="middle" font-size="28" font-weight="700" fill="#065f46">5. 사람 검증</text><text x="130" y="130" text-anchor="middle" font-size="23" fill="#334155">날짜·담당자·수치</text><text x="130" y="178" text-anchor="middle" font-size="22" fill="#334155">최종 판단은 사람</text></g>
  </g>
  <g stroke="#64748b" stroke-width="7" marker-end="url(#arrow)"><line x1="335" y1="430" x2="360" y2="430"/><line x1="635" y1="430" x2="660" y2="430"/><line x1="935" y1="430" x2="960" y2="430"/><line x1="1235" y1="430" x2="1260" y2="430"/></g>
  <rect x="260" y="680" width="1080" height="100" rx="22" fill="#fee2e2"/>
  <text x="800" y="742" text-anchor="middle" font-family="Arial, Noto Sans KR, sans-serif" font-size="30" font-weight="700" fill="#991b1b">실제 개인정보·기관 내부자료는 입력하지 않습니다.</text>
</svg>
