  <rect x="300" y="710" width="1000" height="92" rx="46" fill="#0f172a"/>
  <text x="800" y="768" text-anchor="middle" font-family="Arial, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#fff">최종 결과: 우선 적용 업무 1개 + 검증 기준이 있는 15일 학습 목표</text>
