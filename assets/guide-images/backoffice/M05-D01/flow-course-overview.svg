      <rect width="330" height="330" rx="28" fill="#ecfeff" stroke="#0891b2" stroke-width="4"/>
      <circle cx="165" cy="76" r="42" fill="#0891b2"/><text x="165" y="90" text-anchor="middle" font-size="38" font-weight="700" fill="#fff">3</text>
      <text x="165" y="160" text-anchor="middle" font-size="34" font-weight="700" fill="#164e63">Google 환경</text>
