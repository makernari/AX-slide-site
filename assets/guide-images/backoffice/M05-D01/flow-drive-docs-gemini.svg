<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">경영지원 Drive Docs Gemini 사람 검토 연결</title>
  <desc id="desc">Drive 저장, Docs 작성, Gemini 초안, 사람 검토와 최종 저장을 순환 구조로 보여주는 설명용 개념도</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#475569"/></marker></defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="90" y="96" font-family="Arial, Noto Sans KR, sans-serif" font-size="28" fill="#64748b">설명용 개념도 · 실제 UI 아님</text>
  <text x="90" y="164" font-family="Arial, Noto Sans KR, sans-serif" font-size="54" font-weight="700" fill="#0f172a">Drive–Docs–Gemini는 하나의 작업 경로입니다</text>
  <g font-family="Arial, Noto Sans KR, sans-serif">
    <g transform="translate(130 300)"><rect width="300" height="250" rx="30" fill="#eff6ff" stroke="#2563eb" stroke-width="5"/><text x="150" y="85" text-anchor="middle" font-size="38" font-weight="700" fill="#1e3a8a">Drive</text><text x="150" y="145" text-anchor="middle" font-size="25" fill="#334155">원본·작업·완료</text><text x="150" y="190" text-anchor="middle" font-size="25" fill="#334155">저장하고 다시 찾기</text></g>
    <g transform="translate(500 300)"><rect width="300" height="250" rx="30" fill="#ecfeff" stroke="#0891b2" stroke-width="5"/><text x="150" y="85" text-anchor="middle" font-size="38" font-weight="700" fill="#164e63">Docs</text><text x="150" y="145" text-anchor="middle" font-size="25" fill="#334155">입력과 결과 기록</text><text x="150" y="190" text-anchor="middle" font-size="25" fill="#334155">소유자·위치 확인</text></g>
    <g transform="translate(870 300)"><rect width="300" height="250" rx="30" fill="#f5f3ff" stroke="#7c3aed" stroke-width="5"/><text x="150" y="85" text-anchor="middle" font-size="38" font-weight="700" fill="#4c1d95">Gemini</text><text x="150" y="145" text-anchor="middle" font-size="25" fill="#334155">진단·초안 생성</text><text x="150" y="190" text-anchor="middle" font-size="25" fill="#334155">확인 필요 표시</text></g>
    <g transform="translate(1240 300)"><rect width="260" height="250" rx="30" fill="#ecfdf5" stroke="#059669" stroke-width="5"/><text x="130" y="85" text-anchor="middle" font-size="38" font-weight="700" fill="#065f46">사람</text><text x="130" y="145" text-anchor="middle" font-size="25" fill="#334155">사실·보안 검토</text><text x="130" y="190" text-anchor="middle" font-size="25" fill="#334155">최종 결정</text></g>
  </g>
  <g stroke="#475569" stroke-width="8" marker-end="url(#a)"><line x1="440" y1="425" x2="485" y2="425"/><line x1="810" y1="425" x2="855" y2="425"/><line x1="1180" y1="425" x2="1225" y2="425"/><path d="M1370 570V700H280V570" fill="none"/></g>
  <text x="800" y="765" text-anchor="middle" font-family="Arial, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#0f172a">검토한 결과는 다시 Drive의 완료 상태에 저장합니다.</text>
</svg>
