<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">마케팅 Drive Docs Gemini 브랜드 검토 연결</title>
  <desc id="desc">Drive 저장, Docs 기획, Gemini 콘텐츠 초안, 사람의 브랜드와 사실 검토를 순환 구조로 보여주는 설명용 개념도</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#57534e"/></marker></defs>
  <rect width="1600" height="900" fill="#fffaf5"/>
  <text x="90" y="96" font-family="Arial, Noto Sans KR, sans-serif" font-size="28" fill="#78716c">설명용 개념도 · 실제 UI 아님</text>
  <text x="90" y="164" font-family="Arial, Noto Sans KR, sans-serif" font-size="54" font-weight="700" fill="#1c1917">콘텐츠도 저장→기획→생성→검토의 경로로 관리합니다</text>
  <g font-family="Arial, Noto Sans KR, sans-serif">
    <g transform="translate(130 300)"><rect width="300" height="250" rx="30" fill="#eff6ff" stroke="#2563eb" stroke-width="5"/><text x="150" y="85" text-anchor="middle" font-size="38" font-weight="700" fill="#1e3a8a">Drive</text><text x="150" y="145" text-anchor="middle" font-size="25" fill="#44403c">원본·작업·완료</text><text x="150" y="190" text-anchor="middle" font-size="25" fill="#44403c">버전 다시 찾기</text></g>
    <g transform="translate(500 300)"><rect width="300" height="250" rx="30" fill="#fff7ed" stroke="#ea580c" stroke-width="5"/><text x="150" y="85" text-anchor="middle" font-size="38" font-weight="700" fill="#9a3412">Docs</text><text x="150" y="145" text-anchor="middle" font-size="25" fill="#44403c">목표·대상·채널</text><text x="150" y="190" text-anchor="middle" font-size="25" fill="#44403c">입력 사실 기록</text></g>
    <g transform="translate(870 300)"><rect width="300" height="250" rx="30" fill="#fdf4ff" stroke="#c026d3" stroke-width="5"/><text x="150" y="85" text-anchor="middle" font-size="38" font-weight="700" fill="#86198f">Gemini</text><text x="150" y="145" text-anchor="middle" font-size="25" fill="#44403c">진단·콘텐츠 초안</text><text x="150" y="190" text-anchor="middle" font-size="25" fill="#44403c">확인 필요 표시</text></g>
    <g transform="translate(1240 300)"><rect width="260" height="250" rx="30" fill="#f0fdf4" stroke="#16a34a" stroke-width="5"/><text x="130" y="85" text-anchor="middle" font-size="38" font-weight="700" fill="#166534">사람</text><text x="130" y="145" text-anchor="middle" font-size="25" fill="#44403c">브랜드·사실</text><text x="130" y="190" text-anchor="middle" font-size="25" fill="#44403c">저작권 검토</text></g>
  </g>
  <g stroke="#57534e" stroke-width="8" marker-end="url(#a)"><line x1="440" y1="425" x2="485" y2="425"/><line x1="810" y1="425" x2="855" y2="425"/><line x1="1180" y1="425" x2="1225" y2="425"/><path d="M1370 570V700H280V570" fill="none"/></g>
  <text x="800" y="765" text-anchor="middle" font-family="Arial, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#1c1917">검토한 콘텐츠만 Drive의 완료 상태로 이동합니다.</text>
</svg>
