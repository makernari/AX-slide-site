<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">마케팅 콘텐츠 6단 파이프라인</title>
  <desc id="desc">자료 조사, 기획, 이미지와 영상, 브랜드 검토, 채널 준비, 성과 질문의 여섯 단계를 보여주는 설명용 흐름도</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#78716c"/></marker></defs>
  <rect width="1600" height="900" fill="#fffaf5"/>
  <text x="90" y="96" font-family="Arial, Noto Sans KR, sans-serif" font-size="28" fill="#78716c">설명용 개념도 · 실제 UI 아님</text>
  <text x="90" y="164" font-family="Arial, Noto Sans KR, sans-serif" font-size="54" font-weight="700" fill="#1c1917">마케팅 AI 활용은 하나의 콘텐츠 파이프라인입니다</text>
  <g font-family="Arial, Noto Sans KR, sans-serif">
    <g transform="translate(45 300)"><rect width="220" height="250" rx="28" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/><text x="110" y="80" text-anchor="middle" font-size="28" font-weight="700" fill="#9a3412">1. 자료 조사</text><text x="110" y="142" text-anchor="middle" font-size="22" fill="#44403c">출처·시점 확인</text><text x="110" y="184" text-anchor="middle" font-size="22" fill="#44403c">질문 구조화</text></g>
    <g transform="translate(305 300)"><rect width="220" height="250" rx="28" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="110" y="80" text-anchor="middle" font-size="28" font-weight="700" fill="#92400e">2. 기획</text><text x="110" y="142" text-anchor="middle" font-size="22" fill="#44403c">목표·대상</text><text x="110" y="184" text-anchor="middle" font-size="22" fill="#44403c">핵심 메시지</text></g>
    <g transform="translate(565 300)"><rect width="220" height="250" rx="28" fill="#fdf4ff" stroke="#c026d3" stroke-width="4"/><text x="110" y="80" text-anchor="middle" font-size="28" font-weight="700" fill="#86198f">3. 제작</text><text x="110" y="142" text-anchor="middle" font-size="22" fill="#44403c">카피·이미지</text><text x="110" y="184" text-anchor="middle" font-size="22" fill="#44403c">초안 만들기</text></g>
    <g transform="translate(825 300)"><rect width="220" height="250" rx="28" fill="#f0fdf4" stroke="#16a34a" stroke-width="4"/><text x="110" y="80" text-anchor="middle" font-size="28" font-weight="700" fill="#166534">4. 브랜드</text><text x="110" y="142" text-anchor="middle" font-size="22" fill="#44403c">사실·표현</text><text x="110" y="184" text-anchor="middle" font-size="22" fill="#44403c">저작권 검토</text></g>
    <g transform="translate(1085 300)"><rect width="220" height="250" rx="28" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="110" y="80" text-anchor="middle" font-size="28" font-weight="700" fill="#1e3a8a">5. 채널</text><text x="110" y="142" text-anchor="middle" font-size="22" fill="#44403c">독자 상황</text><text x="110" y="184" text-anchor="middle" font-size="22" fill="#44403c">형식 재구성</text></g>
    <g transform="translate(1345 300)"><rect width="210" height="250" rx="28" fill="#ecfeff" stroke="#0891b2" stroke-width="4"/><text x="105" y="80" text-anchor="middle" font-size="28" font-weight="700" fill="#164e63">6. 성과</text><text x="105" y="142" text-anchor="middle" font-size="22" fill="#44403c">지표 정의</text><text x="105" y="184" text-anchor="middle" font-size="22" fill="#44403c">개선 질문</text></g>
  </g>
  <g stroke="#78716c" stroke-width="7" marker-end="url(#arrow)"><line x1="270" y1="425" x2="295" y2="425"/><line x1="530" y1="425" x2="555" y2="425"/><line x1="790" y1="425" x2="815" y2="425"/><line x1="1050" y1="425" x2="1075" y2="425"/><line x1="1310" y1="425" x2="1335" y2="425"/></g>
  <rect x="280" y="680" width="1040" height="100" rx="22" fill="#fee2e2"/>
  <text x="800" y="742" text-anchor="middle" font-family="Arial, Noto Sans KR, sans-serif" font-size="30" font-weight="700" fill="#991b1b">앞 단계의 사실이 틀리면 뒤 단계의 생성량이 많아도 품질은 좋아지지 않습니다.</text>
</svg>
