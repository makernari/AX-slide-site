<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><rect width="1600" height="900" fill="#F7F9FC"/><rect x="64" y="54" width="1472" height="792" rx="34" fill="#FFFFFF" stroke="#C9D7EC" stroke-width="3"/><rect x="64" y="54" width="1472" height="150" rx="34" fill="#0B1F44"/><rect x="108" y="94" width="248" height="58" rx="29" fill="#FF6B57"/><text x="232" y="133" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="27" font-weight="750" fill="#FFFFFF" text-anchor="middle"><tspan x="232" dy="0">최신 업데이트 카드</tspan></text><text x="1490" y="132" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="24" font-weight="600" fill="#D8E5FF" text-anchor="end"><tspan x="1490" dy="0">2026-08-08 확인</tspan></text><text x="104" y="263" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="42" font-weight="800" fill="#0B1F44" text-anchor="start"><tspan x="104" dy="0">Codex 작업은 파일 수정이 아니라 검증까지가 한 단위입니다</tspan></text><rect x="105" y="300" width="1390" height="100" rx="22" fill="#FFFFFF" stroke="#D9E2F2" stroke-width="2"/><circle cx="158" cy="350" r="25" fill="#FF6B57"/><text x="158" y="360" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="158" dy="0">1</tspan></text><text x="210" y="343" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="25" font-weight="650" fill="#172B4D" text-anchor="start"><tspan x="210" dy="0">좋은 요청은 목표·관련 파일·제약·완료 조건을 함께 제공</tspan></text><rect x="105" y="426" width="1390" height="100" rx="22" fill="#FFFFFF" stroke="#D9E2F2" stroke-width="2"/><circle cx="158" cy="476" r="25" fill="#FF6B57"/><text x="158" y="486" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="158" dy="0">2</tspan></text><text x="210" y="469" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="25" font-weight="650" fill="#172B4D" text-anchor="start"><tspan x="210" dy="0">수정 뒤 실행·테스트·diff 검토를 요청하고 결과 경로와 검증 명령을 기록</tspan></text><rect x="105" y="552" width="1390" height="100" rx="22" fill="#FFFFFF" stroke="#D9E2F2" stroke-width="2"/><circle cx="158" cy="602" r="25" fill="#FF6B57"/><text x="158" y="612" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="158" dy="0">3</tspan></text><text x="210" y="595" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="25" font-weight="650" fill="#172B4D" text-anchor="start"><tspan x="210" dy="0">샌드박스와 승인 정책이 쓰기 범위·네트워크·외부 동작을 제한</tspan></text><rect x="105" y="690" width="900" height="130" rx="22" fill="#EAF2FF"/><text x="137" y="720" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" font-weight="650" fill="#155EEF" text-anchor="start"><tspan x="137" dy="0">수업 반영</tspan><tspan x="137" dy="25">제공 스타터 앱을 분석한 뒤 직무별 기능 하나만 추가하고, 변경</tspan><tspan x="137" dy="25">파일·테스트 입력·정상 결과·남은 한계를 작업보고서로 남깁니다.</tspan></text><rect x="1030" y="690" width="465" height="130" rx="22" fill="#FFF1E8"/><text x="1060" y="720" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="650" fill="#9A3412" text-anchor="start"><tspan x="1060" dy="0">확인</tspan><tspan x="1060" dy="24">삭제·배포·외부 전송·비용 발생·작업</tspan><tspan x="1060" dy="24">폴더 밖 변경은 별도 승인 없이는</tspan><tspan x="1060" dy="24">수행하지 않습니다.</tspan></text><text x="800" y="842" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="500" fill="#667085" text-anchor="middle"><tspan x="800" dy="0">교육용 요약 · 메뉴·제공 범위·비용은 수업 계정에서 확인</tspan></text></svg>
