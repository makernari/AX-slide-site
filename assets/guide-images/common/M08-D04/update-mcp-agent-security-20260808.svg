<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><rect width="1600" height="900" fill="#F7F9FC"/><rect x="64" y="54" width="1472" height="792" rx="34" fill="#FFFFFF" stroke="#C9D7EC" stroke-width="3"/><rect x="64" y="54" width="1472" height="150" rx="34" fill="#0B1F44"/><rect x="108" y="94" width="248" height="58" rx="29" fill="#FF6B57"/><text x="232" y="133" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="27" font-weight="750" fill="#FFFFFF" text-anchor="middle"><tspan x="232" dy="0">최신 업데이트 카드</tspan></text><text x="1490" y="132" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="24" font-weight="600" fill="#D8E5FF" text-anchor="end"><tspan x="1490" dy="0">2026-08-08 확인</tspan></text><text x="104" y="263" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="42" font-weight="800" fill="#0B1F44" text-anchor="start"><tspan x="104" dy="0">도구를 쓸 수 있다는 것과 실행해도 된다는 것은 다릅니다</tspan></text><rect x="105" y="300" width="1390" height="100" rx="22" fill="#FFFFFF" stroke="#D9E2F2" stroke-width="2"/><circle cx="158" cy="350" r="25" fill="#FF6B57"/><text x="158" y="360" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="158" dy="0">1</tspan></text><text x="210" y="343" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="25" font-weight="650" fill="#172B4D" text-anchor="start"><tspan x="210" dy="0">Function Calling은 모델의 도구 요청과 애플리케이션의 실제 실행을 분리</tspan></text><rect x="105" y="426" width="1390" height="100" rx="22" fill="#FFFFFF" stroke="#D9E2F2" stroke-width="2"/><circle cx="158" cy="476" r="25" fill="#FF6B57"/><text x="158" y="486" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="158" dy="0">2</tspan></text><text x="210" y="469" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="25" font-weight="650" fill="#172B4D" text-anchor="start"><tspan x="210" dy="0">MCP는 리소스·프롬프트·도구를 연결하지만 데이터 접근과 실행에는 사용자 동의가 필요</tspan></text><rect x="105" y="552" width="1390" height="100" rx="22" fill="#FFFFFF" stroke="#D9E2F2" stroke-width="2"/><circle cx="158" cy="602" r="25" fill="#FF6B57"/><text x="158" y="612" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="158" dy="0">3</tspan></text><text x="210" y="595" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="25" font-weight="650" fill="#172B4D" text-anchor="start"><tspan x="210" dy="0">도구 설명·외부 문서의 지시문도 신뢰하지 말고 쓰기 작업 전 사람 승인을 확인</tspan></text><rect x="105" y="690" width="900" height="130" rx="22" fill="#EAF2FF"/><text x="137" y="720" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" font-weight="650" fill="#155EEF" text-anchor="start"><tspan x="137" dy="0">수업 반영</tspan><tspan x="137" dy="25">읽기→초안→승인→등록 순서와 입력·출력 스키마를 도구 카드로</tspan><tspan x="137" dy="25">설계하고, 승인 없는 발송·등록·삭제 경로는 제거합니다.</tspan></text><rect x="1030" y="690" width="465" height="130" rx="22" fill="#FFF1E8"/><text x="1060" y="720" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="650" fill="#9A3412" text-anchor="start"><tspan x="1060" dy="0">확인</tspan><tspan x="1060" dy="24">API 키를 카드·프롬프트·로그에</tspan><tspan x="1060" dy="24">기록하지 않고, 프롬프트 인젝션</tspan><tspan x="1060" dy="24">문장은 데이터로 격리합니다.</tspan></text><text x="800" y="842" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="500" fill="#667085" text-anchor="middle"><tspan x="800" dy="0">교육용 요약 · 메뉴·제공 범위·비용은 수업 계정에서 확인</tspan></text></svg>
