  <g><circle cx="214" cy="436" r="52" fill="#2563EB"/><text x="214" y="450" text-anchor="middle" font-size="38" font-weight="900" fill="#FFFFFF">1</text><rect x="60" y="284" width="308" height="104" rx="24" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/><text x="214" y="326" text-anchor="middle" font-size="18" font-weight="800" fill="#2563EB">첫날 시작 전</text><text x="214" y="359" text-anchor="middle" font-size="24" font-weight="900" fill="#17233B">Notion 30~40분</text><rect x="60" y="500" width="308" height="118" rx="24" fill="#F7F9FC" stroke="#D7E0ED" stroke-width="2"/><text x="214" y="542" text-anchor="middle" font-size="16" font-weight="720" fill="#475569">강사 화면을 보며 개인 정리 공간 완성</text><text x="214" y="571" text-anchor="middle" font-size="16" font-weight="720" fill="#475569"></text></g><g><circle cx="594" cy="436" r="52" fill="#7C3AED"/><text x="594" y="450" text-anchor="middle" font-size="38" font-weight="900" fill="#FFFFFF">2</text><rect x="440" y="284" width="308" height="104" rx="24" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/><text x="594" y="326" text-anchor="middle" font-size="18" font-weight="800" fill="#7C3AED">M05~M08</text><text x="594" y="359" text-anchor="middle" font-size="24" font-weight="900" fill="#17233B">관련 페이지만 시연</text><rect x="440" y="500" width="308" height="118" rx="24" fill="#F7F9FC" stroke="#D7E0ED" stroke-width="2"/><text x="594" y="542" text-anchor="middle" font-size="16" font-weight="720" fill="#475569">PDF·워크북 원본은 강사만 열고 배포 </text><text x="594" y="571" text-anchor="middle" font-size="16" font-weight="720" fill="#475569">보류</text></g><g><circle cx="974" cy="436" r="52" fill="#0F766E"/><text x="974" y="450" text-anchor="middle" font-size="38" font-weight="900" fill="#FFFFFF">3</text><rect x="820" y="284" width="308" height="104" rx="24" fill="#FFFFFF" stroke="#0F766E" stroke-width="3"/><text x="974" y="326" text-anchor="middle" font-size="18" font-weight="800" fill="#0F766E">매일 종료</text><text x="974" y="359" text-anchor="middle" font-size="24" font-weight="900" fill="#17233B">개인 Notion 기록</text><rect x="820" y="500" width="308" height="118" rx="24" fill="#F7F9FC" stroke="#D7E0ED" stroke-width="2"/><text x="974" y="542" text-anchor="middle" font-size="16" font-weight="720" fill="#475569">핵심·프롬프트·오류·결과 링크만 남김</text><text x="974" y="571" text-anchor="middle" font-size="16" font-weight="720" fill="#475569"></text></g><g><circle cx="1354" cy="436" r="52" fill="#EA580C"/><text x="1354" y="450" text-anchor="middle" font-size="38" font-weight="900" fill="#FFFFFF">4</text><rect x="1200" y="284" width="308" height="104" rx="24" fill="#FFFFFF" stroke="#EA580C" stroke-width="3"/><text x="1354" y="326" text-anchor="middle" font-size="18" font-weight="800" fill="#EA580C">M09 종료 후</text><text x="1354" y="359" text-anchor="middle" font-size="24" font-weight="900" fill="#17233B">원본 3종 배포</text><rect x="1200" y="500" width="308" height="118" rx="24" fill="#F7F9FC" stroke="#D7E0ED" stroke-width="2"/><text x="1354" y="542" text-anchor="middle" font-size="16" font-weight="720" fill="#475569">권한·파일명·열기·수신 여부 확인</text><text x="1354" y="571" text-anchor="middle" font-size="16" font-weight="720" fill="#475569"></text></g>
  <rect x="88" y="690" width="1424" height="112" rx="28" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/><text x="120" y="735" font-size="19" font-weight="900" fill="#9A3412">배포 안전선</text><text x="270" y="735" font-size="18" font-weight="740" fill="#4B5563">편집 권한 없이 제공 · 저작권/배포 범위 확인 · API Key/개인정보 미포함 · 수신 후 파일 열기 확인</text><text x="270" y="771" font-size="17" font-weight="700" fill="#64748B">Notion에는 원본을 중복 업로드하지 않고 제공 위치·읽은 날짜·내 활용 메모만 기록합니다.</text>
