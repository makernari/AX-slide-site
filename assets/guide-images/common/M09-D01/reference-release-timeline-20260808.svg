  <text x="82" y="102" font-size="18" font-weight="850" fill="#AFC6FF">REFERENCE MATERIAL JOURNEY</text><text x="82" y="165" font-size="40" font-weight="900" fill="#FFFFFF">언제 보여 주고, 언제 배포할까요?</text>
