<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="2026 AI 교육은 결과물 하나보다 수행 과정과 평가 근거를 봅니다"><rect width="1600" height="900" fill="#F7F9FC"/><rect x="64" y="54" width="1472" height="792" rx="34" fill="#FFFFFF" stroke="#C9D7EC" stroke-width="3"/><rect x="64" y="54" width="1472" height="150" rx="34" fill="#0B1F44"/><rect x="108" y="94" width="248" height="58" rx="29" fill="#FF6B57"/><text x="232" y="133" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="27" font-weight="750" fill="#FFFFFF" text-anchor="middle"><tspan x="232" dy="0">최신 업데이트 카드</tspan></text><text x="1490" y="132" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="24" font-weight="600" fill="#D8E5FF" text-anchor="end"><tspan x="1490" dy="0">2026-08-08 확인</tspan></text><text x="104" y="252" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="39" font-weight="800" fill="#0B1F44" text-anchor="start"><tspan x="104" dy="0">2026 AI 교육은 결과물 하나보다 수행 과정과 평가 근거를</tspan><tspan x="104" dy="46">봅니다</tspan></text><rect x="105" y="298" width="1390" height="100" rx="22" fill="#FFFFFF" stroke="#D9E2F2" stroke-width="2"/><circle cx="158" cy="348" r="25" fill="#FF6B57"/><text x="158" y="358" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="28" font-weight="750" fill="#FFFFFF" text-anchor="middle"><tspan x="158" dy="0">1</tspan></text><text x="210" y="341" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="25" font-weight="650" fill="#172B4D" text-anchor="start"><tspan x="210" dy="0">업무용 AI 평가는 성공 기준을 명시하고 실제 조건으로 측정한 뒤 오류를 고치는 순환으로 설계</tspan></text><rect x="105" y="424" width="1390" height="100" rx="22" fill="#FFFFFF" stroke="#D9E2F2" stroke-width="2"/><circle cx="158" cy="474" r="25" fill="#FF6B57"/><text x="158" y="484" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="28" font-weight="750" fill="#FFFFFF" text-anchor="middle"><tspan x="158" dy="0">2</tspan></text><text x="210" y="467" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="25" font-weight="650" fill="#172B4D" text-anchor="start"><tspan x="210" dy="0">학습 평가는 최종 산출물뿐 아니라 이해 확인·오류 수정·학습 과정의 변화를 함께 관찰</tspan></text><rect x="105" y="550" width="1390" height="100" rx="22" fill="#FFFFFF" stroke="#D9E2F2" stroke-width="2"/><circle cx="158" cy="600" r="25" fill="#FF6B57"/><text x="158" y="610" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="28" font-weight="750" fill="#FFFFFF" text-anchor="middle"><tspan x="158" dy="0">3</tspan></text><text x="210" y="593" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="25" font-weight="650" fill="#172B4D" text-anchor="start"><tspan x="210" dy="0">AI 강사는 인간 중심·윤리·AI 기초와 활용·AI 교수법·전문학습을 함께 설계</tspan></text><rect x="105" y="688" width="900" height="132" rx="22" fill="#EAF2FF"/><text x="137" y="718" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" font-weight="650" fill="#155EEF" text-anchor="start"><tspan x="137" dy="0">수업 반영</tspan><tspan x="137" dy="25">시연 전에 완료 루브릭을 공개하고 정상·누락·과장 입력을 같은 기준으로</tspan><tspan x="137" dy="25">시험한 뒤 동료 피드백을 최종 수업안에 반영합니다.</tspan></text><rect x="1030" y="688" width="465" height="132" rx="22" fill="#FFF1E8"/><text x="1060" y="718" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="650" fill="#9A3412" text-anchor="start"><tspan x="1060" dy="0">확인</tspan><tspan x="1060" dy="24">OpenAI의 2026 학습성과 측정</tspan><tspan x="1060" dy="24">체계는 검증 중인 연구입니다. NIST</tspan><tspan x="1060" dy="24">AI RMF 1.0도 개정 중이므로 고정</tspan><tspan x="1060" dy="24">표준처럼 단정하지 않습니다.</tspan></text><text x="800" y="842" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="500" fill="#667085" text-anchor="middle"><tspan x="800" dy="0">교육용 요약 · 특정 도구 메뉴가 아닌 수업 설계·평가 원칙</tspan></text></svg>
