      <text x="210" y="368" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="28" font-weight="650" fill="#172B4D" text-anchor="start"><tspan x="210" dy="0">2026-08-07 기준 n8n 안정 버전은 2.33.7</tspan></text>
