    <text x="1490" y="132" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="24" font-weight="600" fill="#D8E5FF" text-anchor="end"><tspan x="1490" dy="0">2026-08-08 확인</tspan></text>
    <text x="104" y="275" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="44" font-weight="800" fill="#0B1F44" text-anchor="start"><tspan x="104" dy="0">n8n 2.x에서는 저장과 게시가 다른 단계입니다</tspan></text>
