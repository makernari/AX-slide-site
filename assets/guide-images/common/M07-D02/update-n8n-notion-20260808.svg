      <text x="210" y="620" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="28" font-weight="650" fill="#172B4D" text-anchor="start"><tspan x="210" dy="0">Notion 연결은 기능 권한과 대상 페이지·데이터베이스 접근을 함께 부여해야 함</tspan></text>
    <rect x="105" y="684" width="900" height="136" rx="22" fill="#EAF2FF"/>
    <text x="137" y="714" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="650" fill="#155EEF" text-anchor="start"><tspan x="137" dy="0">수업 반영</tspan><tspan x="137" dy="27">수동 실행으로 입력·매핑·출력을 검증한 뒤 게시하고, 게시</tspan><tspan x="137" dy="27">전후 버전과 실행 로그를 결과물에 기록합니다.</tspan></text>
