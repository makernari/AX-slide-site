    <text x="1060" y="714" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" font-weight="650" fill="#9A3412" text-anchor="start"><tspan x="1060" dy="0">확인</tspan><tspan x="1060" dy="25">Cloud·자체 호스팅·버전에</tspan><tspan x="1060" dy="25">따라 메뉴가 다를 수 있어 버튼</tspan><tspan x="1060" dy="25">위치 대신 트리거–매핑–로그–게시</tspan><tspan x="1060" dy="25">상태를 평가합니다.</tspan></text>
    <text x="800" y="842" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="500" fill="#667085" text-anchor="middle"><tspan x="800" dy="0">교육용 요약 · 메뉴와 제공 범위는 수업 계정에서 확인</tspan></text>
  
