<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><rect width="1600" height="900" fill="#F7F9FC"/><rect x="64" y="54" width="1472" height="792" rx="34" fill="#FFFFFF" stroke="#C9D7EC" stroke-width="3"/><rect x="64" y="54" width="1472" height="150" rx="34" fill="#0B1F44"/><rect x="108" y="94" width="248" height="58" rx="29" fill="#FF6B57"/><text x="232" y="133" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="27" font-weight="750" fill="#FFFFFF" text-anchor="middle"><tspan x="232" dy="0">최신 업데이트 카드</tspan></text><text x="1490" y="132" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="24" font-weight="600" fill="#D8E5FF" text-anchor="end"><tspan x="1490" dy="0">2026-08-08 확인</tspan></text><text x="104" y="263" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="42" font-weight="800" fill="#0B1F44" text-anchor="start"><tspan x="104" dy="0">RAG는 업로드보다 검색 근거와 수명주기 관리가 핵심입니다</tspan></text><rect x="105" y="300" width="1390" height="100" rx="22" fill="#FFFFFF" stroke="#D9E2F2" stroke-width="2"/><circle cx="158" cy="350" r="25" fill="#FF6B57"/><text x="158" y="360" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="158" dy="0">1</tspan></text><text x="210" y="343" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="25" font-weight="650" fill="#172B4D" text-anchor="start"><tspan x="210" dy="0">문서는 분할·임베딩·색인된 뒤 질문과 가까운 조각을 검색해 답변 근거로 사용</tspan></text><rect x="105" y="426" width="1390" height="100" rx="22" fill="#FFFFFF" stroke="#D9E2F2" stroke-width="2"/><circle cx="158" cy="476" r="25" fill="#FF6B57"/><text x="158" y="486" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="158" dy="0">2</tspan></text><text x="210" y="469" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="25" font-weight="650" fill="#172B4D" text-anchor="start"><tspan x="210" dy="0">파일 검색 결과는 답변과 파일 인용·검색 기록을 함께 검토</tspan></text><rect x="105" y="552" width="1390" height="100" rx="22" fill="#FFFFFF" stroke="#D9E2F2" stroke-width="2"/><circle cx="158" cy="602" r="25" fill="#FF6B57"/><text x="158" y="612" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="158" dy="0">3</tspan></text><text x="210" y="595" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="25" font-weight="650" fill="#172B4D" text-anchor="start"><tspan x="210" dy="0">서비스별 원본 파일·색인 저장 기간과 삭제 방식이 다르므로 수업 계정에서 확인</tspan></text><rect x="105" y="690" width="900" height="130" rx="22" fill="#EAF2FF"/><text x="137" y="720" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" font-weight="650" fill="#155EEF" text-anchor="start"><tspan x="137" dy="0">수업 반영</tspan><tspan x="137" dy="25">가상 문서 ID를 근거로 답하고, 문서에 없는 질문은 추측하지</tspan><tspan x="137" dy="25">않으며 정상·모호·함정·충돌 질문을 같은 평가표로 시험합니다.</tspan></text><rect x="1030" y="690" width="465" height="130" rx="22" fill="#FFF1E8"/><text x="1060" y="720" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="650" fill="#9A3412" text-anchor="start"><tspan x="1060" dy="0">확인</tspan><tspan x="1060" dy="24">실제 규정·비공개 브랜드 자료는</tspan><tspan x="1060" dy="24">업로드하지 않습니다. 이 수업은</tspan><tspan x="1060" dy="24">제공된 가상 문서로만 진행합니다.</tspan></text><text x="800" y="842" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="500" fill="#667085" text-anchor="middle"><tspan x="800" dy="0">교육용 요약 · 메뉴·제공 범위·비용은 수업 계정에서 확인</tspan></text></svg>
