    <text x="137" y="714" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="650" fill="#155EEF" text-anchor="start"><tspan x="137" dy="0">수업 반영</tspan><tspan x="137" dy="27">모든 학습자는 CSV 업로드 또는 필요한 범위 복사로 같은</tspan><tspan x="137" dy="27">분석을 수행하고, 사이드바가 보이면 동일 질문을 재검증하는</tspan><tspan x="137" dy="27">선택 경로로 씁니다.</tspan></text>
