<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1152" viewBox="0 0 2048 1152">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBFCFE"/><stop offset="1" stop-color="#F1F4FA"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3157D5"/><stop offset="1" stop-color="#14A89A"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#3157D5" stop-opacity=".22"/><stop offset=".72" stop-color="#3157D5" stop-opacity=".05"/><stop offset="1" stop-color="#3157D5" stop-opacity="0"/></radialGradient>
    <linearGradient id="heroShade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#10182B" stop-opacity="0"/><stop offset="1" stop-color="#10182B" stop-opacity=".76"/></linearGradient>
    <clipPath id="heroClip"><rect x="104" y="370" width="1840" height="550" rx="48"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#16213A" flood-opacity=".12"/></filter>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#16213A" flood-opacity=".10"/></filter>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#9DABC1" opacity=".18"/></pattern>
  </defs>
  <rect width="2048" height="1152" fill="url(#bg)"/>
  <rect width="2048" height="1152" fill="url(#dots)"/>
  <circle cx="1882" cy="142" r="270" fill="url(#halo)"/>
  <style>
    .meta{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:25px;font-weight:800;letter-spacing:1px}
    .title{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:80px;font-weight:900;letter-spacing:-3px;fill:#10182B}
    .subtitle{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:31px;font-weight:650;letter-spacing:-.8px;fill:#536078}
    .label{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:31px;font-weight:850;letter-spacing:-1px}
    .final{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:36px;font-weight:900;letter-spacing:-1px}
    .core{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:29px;font-weight:850;letter-spacing:-.8px}
    .small{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:23px;font-weight:650;letter-spacing:-.4px}
    .step{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:20px;font-weight:900;letter-spacing:1px}
    .ghost{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:64px;font-weight:900;opacity:.13}
  </style>
  <rect x="104" y="60" width="154" height="48" rx="24" fill="url(#brand)"/>
  <text x="181" y="93" text-anchor="middle" class="meta" fill="#FFFFFF">예비 자료</text>
  <text x="1944" y="93" text-anchor="end" class="meta" fill="#3157D5">공통 · M06 D01</text>
  <text x="104" y="207" class="title">한글은 하이브리드로 안전하게 넣기</text>
  <text x="106" y="288" text-anchor="start" class="subtitle" fill="#536078">생성 이미지와 정확한 한글 조판을 분리하면 시각 품질과 정확성을 함께 지킬 수 있다.</text>
  <rect x="140" y="386" width="760" height="490" rx="42" fill="#EEF2FF" opacity=".55"/><rect x="182" y="410" width="126" height="44" rx="22" fill="#3157D5"/><text x="245" y="440" text-anchor="middle" class="step" fill="#FFFFFF">관점 1</text><g filter="url(#softShadow)"><rect x="194" y="485" width="650" height="150" rx="28" fill="#FFFFFF" stroke="#3157D5" stroke-width="3"/></g><circle cx="268" cy="560" r="49" fill="#EEF2FF"/><g transform="translate(231 523) scale(0.74)"><rect x="15" y="22" width="62" height="68" rx="14" fill="none" stroke="#3157D5" stroke-width="7"/><path d="M31 45h30M31 62h22" stroke="#3157D5" stroke-width="7" stroke-linecap="round"/><path d="M80 5l7 16 16 7-16 7-7 16-7-16-16-7 16-7z" fill="#14A89A"/></g><text x="564" y="572" text-anchor="middle" class="label" fill="#10182B">배경 생성</text><g filter="url(#softShadow)"><rect x="194" y="675" width="650" height="150" rx="28" fill="#FFFFFF" stroke="#3157D5" stroke-width="3"/></g><circle cx="268" cy="750" r="49" fill="#EEF2FF"/><g transform="translate(231 713) scale(0.74)"><circle cx="50" cy="50" r="35" fill="none" stroke="#3157D5" stroke-width="7"/><circle cx="50" cy="50" r="12" fill="#14A89A"/><path d="M50 7v13M50 80v13M7 50h13M80 50h13" stroke="#3157D5" stroke-width="7" stroke-linecap="round"/></g><text x="564" y="762" text-anchor="middle" class="label" fill="#10182B">텍스트 비우기</text><rect x="1148" y="386" width="760" height="490" rx="42" fill="#EAF8F5" opacity=".55"/><rect x="1190" y="410" width="126" height="44" rx="22" fill="#14A89A"/><text x="1253" y="440" text-anchor="middle" class="step" fill="#FFFFFF">관점 2</text><g filter="url(#softShadow)"><rect x="1202" y="485" width="650" height="150" rx="28" fill="#FFFFFF" stroke="#14A89A" stroke-width="3"/></g><circle cx="1276" cy="560" r="49" fill="#EAF8F5"/><g transform="translate(1239 523) scale(0.74)"><circle cx="50" cy="50" r="35" fill="none" stroke="#14A89A" stroke-width="7"/><circle cx="50" cy="50" r="12" fill="#3157D5"/><path d="M50 7v13M50 80v13M7 50h13M80 50h13" stroke="#14A89A" stroke-width="7" stroke-linecap="round"/></g><text x="1572" y="572" text-anchor="middle" class="label" fill="#10182B">한글 조판</text><g filter="url(#softShadow)"><rect x="1202" y="675" width="650" height="150" rx="28" fill="#FFFFFF" stroke="#14A89A" stroke-width="3"/></g><circle cx="1276" cy="750" r="49" fill="#EAF8F5"/><g transform="translate(1239 713) scale(0.74)"><circle cx="50" cy="50" r="39" fill="none" stroke="#14A89A" stroke-width="7"/><path d="M29 50l14 14 29-34" fill="none" stroke="#3157D5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1572" y="762" text-anchor="middle" class="label" fill="#10182B">최종 대조</text><g filter="url(#shadow)"><circle cx="1024" cy="628" r="86" fill="#FFFFFF" stroke="url(#brand)" stroke-width="8"/></g><path d="M984 628h80M1004 606l-22 22 22 22M1044 606l22 22-22 22" fill="none" stroke="#3157D5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>