  </style>
  <rect x="104" y="60" width="154" height="48" rx="24" fill="url(#brand)"/>
  <text x="181" y="93" text-anchor="middle" class="meta" fill="#FFFFFF">선택 자료</text>
  <text x="1944" y="93" text-anchor="end" class="meta" fill="#3157D5">공통 · M07 D02</text>
  <text x="104" y="207" class="title">자동화는 수동 시험 뒤에 공개한다</text>
  <text x="106" y="288" text-anchor="start" class="subtitle" fill="#536078">수동 실행·결과 검토·공개·실행 기록의 순서를 지켜야 오류를 작게 발견할 수 있다.</text>
  <path d="M275 626C540 570 575 682 760 626S1100 570 1288 626s315 56 485 0" fill="none" stroke="url(#brand)" stroke-width="18" stroke-linecap="round" opacity=".18"/><path d="M275 626v-16" stroke="#3157D5" stroke-width="6" stroke-linecap="round"/><g filter="url(#softShadow)"><rect x="95" y="410" width="360" height="170" rx="32" fill="#FFFFFF" stroke="#3157D5" stroke-width="3"/></g><g transform="translate(230 435) scale(0.9)"><circle cx="50" cy="50" r="35" fill="none" stroke="#3157D5" stroke-width="7"/><circle cx="50" cy="50" r="12" fill="#14A89A"/><path d="M50 7v13M50 80v13M7 50h13M80 50h13" stroke="#3157D5" stroke-width="7" stroke-linecap="round"/></g><text x="275" y="555" text-anchor="middle" class="label" fill="#10182B">수동 실행</text><circle cx="275" cy="626" r="32" fill="#3157D5"/><text x="275" y="635" text-anchor="middle" class="step" fill="#FFFFFF">1</text><path d="M760 626v36" stroke="#14A89A" stroke-width="6" stroke-linecap="round"/><g filter="url(#softShadow)"><rect x="580" y="690" width="360" height="170" rx="32" fill="#FFFFFF" stroke="#14A89A" stroke-width="3"/></g><g transform="translate(715 715) scale(0.9)"><circle cx="50" cy="50" r="39" fill="none" stroke="#14A89A" stroke-width="7"/><path d="M29 50l14 14 29-34" fill="none" stroke="#3157D5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="760" y="835" text-anchor="middle" class="label" fill="#10182B">결과 검토</text><circle cx="760" cy="626" r="32" fill="#14A89A"/><text x="760" y="635" text-anchor="middle" class="step" fill="#FFFFFF">2</text><path d="M1288 626v-16" stroke="#3157D5" stroke-width="6" stroke-linecap="round"/><g filter="url(#softShadow)"><rect x="1108" y="410" width="360" height="170" rx="32" fill="#FFFFFF" stroke="#3157D5" stroke-width="3"/></g><g transform="translate(1243 435) scale(0.9)"><circle cx="50" cy="50" r="35" fill="none" stroke="#3157D5" stroke-width="7"/><circle cx="50" cy="50" r="12" fill="#14A89A"/><path d="M50 7v13M50 80v13M7 50h13M80 50h13" stroke="#31