  <text x="104" y="207" class="title">게시 권한이 없을 때의 수동 경로</text>
  <text x="106" y="288" text-anchor="start" class="subtitle" fill="#625A6B">자동 게시를 강행하지 말고 초안 저장과 담당자 전달로 안전하게 전환한다.</text>
