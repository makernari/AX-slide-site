<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1152" viewBox="0 0 2048 1152">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBFCFE"/><stop offset="1" stop-color="#F1F4FA"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3157D5"/><stop offset="1" stop-color="#14A89A"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#3157D5" stop-opacity=".22"/><stop offset=".72" stop-color="#3157D5" stop-opacity=".05"/><stop offset="1" stop-color="#3157D5" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#16213A" flood-opacity=".12"/></filter>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#16213A" flood-opacity=".10"/></filter>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#9DABC1" opacity=".18"/></pattern>
  </defs>
  <rect width="2048" height="1152" fill="url(#bg)"/>
  <rect width="2048" height="1152" fill="url(#dots)"/>
  <circle cx="1882" cy="142" r="270" fill="url(#halo)"/>
  <style>
    .meta{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:25px;font-weight:800;letter-spacing:1px}
    .title{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:80px;font-weight:900;letter-spacing:-3px;fill:#10182B}
    .subtitle{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:31px;font-weight:650;letter-spacing:-.8px;fill:#536078}
    .label{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:31px;font-weight:850;letter-spacing:-1px}
    .final{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:36px;font-weight:900;letter-spacing:-1px}
    .core{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:29px;font-weight:850;letter-spacing:-.8px}
    .small{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:23px;font-weight:650;letter-spacing:-.4px}
    .step{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:20px;font-weight:900;letter-spacing:1px}
    .ghost{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:64px;font-weight:900;opacity:.13}
  </style>
  <rect x="104" y="60" width="154" height="48" rx="24" fill="url(#brand)"/>
  <text x="181" y="93" text-anchor="middle" class="meta" fill="#FFFFFF">심화 자료</text>
  <text x="1944" y="93" text-anchor="end" class="meta" fill="#3157D5">공통 · M05 D03</text>
  <text x="104" y="207" class="title">오디오 요약도 원문으로 검증한다</text>
  <text x="106" y="288" text-anchor="start" class="subtitle" fill="#536078">AI 오디오 요약은 이해 보조물이며 사실 확인은 원문 출처로 돌아가야 한다.</text>
  <g filter="url(#softShadow)"><path d="M155 706h370v180H155z" fill="#FFFFFF" stroke="#DFE5EF" stroke-width="2"/></g><text x="185" y="756" class="step" fill="#3157D5">01</text><g transform="translate(292 744) scale(0.88)"><circle cx="50" cy="50" r="43" fill="none" stroke="#3157D5" stroke-width="7"/><path d="M20 52h12l8-24 12 46 10-33 8 11h12" fill="none" stroke="#14A89A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="340" y="866" text-anchor="middle" class="label" fill="#10182B">듣기</text><g filter="url(#softShadow)"><path d="M593 614h370v272H593z" fill="#FFFFFF" stroke="#DFE5EF" stroke-width="2"/></g><text x="623" y="664" class="step" fill="#3157D5">02</text><g transform="translate(730 652) scale(0.88)"><rect x="12" y="12" width="76" height="76" rx="13" fill="none" stroke="#3157D5" stroke-width="7"/><path d="M50 12v76M12 50h76" stroke="#14A89A" stroke-width="6"/></g><text x="778" y="774" text-anchor="middle" class="label" fill="#10182B">주장 표시</text><g filter="url(#softShadow)"><path d="M1031 522h370v364H1031z" fill="#FFFFFF" stroke="#DFE5EF" stroke-width="2"/></g><text x="1061" y="572" class="step" fill="#3157D5">03</text><g transform="translate(1168 560) scale(0.88)"><circle cx="50" cy="50" r="39" fill="none" stroke="#3157D5" stroke-width="7"/><path d="M29 50l14 14 29-34" fill="none" stroke="#14A89A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1216" y="682" text-anchor="middle" class="label" fill="#10182B">원문 대조</text><g filter="url(#softShadow)"><path d="M1469 430h370v456H1469z" fill="url(#brand)" stroke="#3157D5" stroke-width="5"/></g><text x="1499" y="480" class="step" fill="#FFFFFF">04</text><g transform="translate(1606 468) scale(0.88)"><circle cx="50" cy="50" r="35" fill="none" stroke="#FFFFFF" stroke-width="7"/><circle cx="50" cy="50" r="12" fill="#FFFFFF"/><path d="M50 7v13M50 80v13M7 50h13M80 50h13" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/></g><text x="1654" y="590" text-anchor="middle" class="label" fill="#FFFFFF">수정 기록</text>
</svg>