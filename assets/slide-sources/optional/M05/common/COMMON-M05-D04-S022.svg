  <rect x="104" y="60" width="154" height="48" rx="24" fill="url(#brand)"/>
  <text x="181" y="93" text-anchor="middle" class="meta" fill="#FFFFFF">선택 자료</text>
  <text x="1944" y="93" text-anchor="end" class="meta" fill="#3157D5">공통 · M05 D04</text>
  <text x="104" y="207" class="title">도구 이름을 가린 채 먼저 비교하기</text>
  <text x="106" y="288" text-anchor="start" class="subtitle" fill="#536078">도구 선호보다 목적·정확성·수정성·재사용성을 같은 기준으로 비교한다.</text>
  <rect x="140" y="386" width="760" height="490" rx="42" fill="#EEF2FF" opacity=".55"/><rect x="182" y="410" width="126" height="44" rx="22" fill="#3157D5"/><text x="245" y="440" text-anchor="middle" class="step" fill="#FFFFFF">동일 조건</text><g filter="url(#softShadow)"><rect x="194" y="485" width="650" height="150" rx="28" fill="#FFFFFF" stroke="#3157D5" stroke-width="3"/></g><circle cx="268" cy="560" r="49" fill="#EEF2FF"/><g transform="translate(231 523) scale(0.74)"><circle cx="50" cy="50" r="35" fill="none" stroke="#3157D5" stroke-width="7"/><circle cx="50" cy="50" r="12" fill="#14A89A"/><path d="M50 7v13M50 80v13M7 50h13M80 50h13" stroke="#3157D5" stroke-width="7" stroke-linecap="round"/></g><text x="564" y="572" text-anchor="middle" class="label" fill="#10182B">목적</text><g filter="url(#softShadow)"><rect x="194" y="675" width="650" height="150" rx="28" fill="#FFFFFF" stroke="#3157D5" stroke-width="3"/></g><circle cx="268" cy="750" r="49" fill="#EEF2FF"/><g transform="translate(231 713) scale(0.74)"><circle cx="50" cy="50" r="35" fill="none" stroke="#3157D5" stroke-width="7"/><circle cx="50" cy="50" r="12" fill="#14A89A"/><path d="M50 7v13M50 80v13M7 50h13M80 50h13" stroke="#3157D5" stroke-width="7" stroke-linecap="round"/></g><text x="564" y="762" text-anchor="middle" class="label" fill="#10182B">정확성</text><rect x="1148" y="386" width="760" height="490" rx="42" fill="#EAF8F5" opacity=".55"/><rect x="1190" y="410" width="126" height="44" rx="22" fill="#14A89A"/><text x="1253" y="440" text-anchor="middle" class="step" fill="#FFFFFF">평가 기록</text><g filter="url(#softShadow)"><rect x="1202" y="485" width="650" height="150" rx="28" fill="#FFFFFF" stroke="#14A89A" stroke-width="3"/></g><circle cx="1276" cy="560" r="49" fill="#EAF8F5"/><g transform="translate(1239 523) scale(0.74)"><circle cx="50" cy="50" r="35" fill="none" stroke="#14A89A" stroke-width="7"/><circle cx="50" cy="50" r="12" fill="#3157D5"/><path d="M50 7v13M50 80v13M7 50h13M80 50h13" stroke="#14A89A" stroke-width="7" stroke-linecap="round"/></g><text x="1572" y="572" text-anchor="middle" class="label" fill="#10182B">수정성</text><g filter="url(#softShadow)"><rect x="1202" y="675" width="650" height="150" rx="28" fill="#FFFFFF" stroke="#14A89A" stroke-width="3"/></g><circle cx="1276" cy="750" r="49" fill="#EAF8F5"/><g transform="translate(1239 713) scale(0.74)"><circle cx="50" cy="50" r="35" fill="none" stroke="#14A89A" stroke-width="7"/><circle cx="50" cy="50" r="12" fill="#3157D5"/><path d="M50 7v13M50 80v13M7 50h13M80 50h13" stroke="#14A89A" stroke-width="7" stroke-linecap="round"/></g><text x="1572" y="762" text-anchor="middle" class="label" fill="#10182B">재사용성</text><g filter="url(#shadow)"><circle cx="1024" cy="628" r="86" fill="#FFFFFF" stroke="url(#brand)" stroke-width="8"/></g><path d="M984 628h80M1004 606l-22 22 22 22M1044 606l22 22-22 22" fill="none" stroke="#3157D5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
