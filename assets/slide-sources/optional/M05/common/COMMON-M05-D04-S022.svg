    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3157D5"/><stop offset="1" stop-color="#14A89A"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#3157D5" stop-opacity=".22"/><stop offset=".72" stop-color="#3157D5" stop-opacity=".05"/><stop offset="1" stop-color="#3157D5" stop-opacity="0"/></radialGradient>
