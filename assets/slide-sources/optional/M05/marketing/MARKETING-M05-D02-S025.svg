  <rect width="2048" height="1152" fill="url(#bg)"/>
  <rect width="2048" height="1152" fill="url(#dots)"/>
  <circle cx="1882" cy="142" r="270" fill="url(#halo)"/>
  <style>
    .meta{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:25px;font-weight:800;letter-spacing:1px}
    .title{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:80px;font-weight:900;letter-spacing:-3px;fill:#201D2C}
