  <text x="1944" y="93" text-anchor="end" class="meta" fill="#E6614F">마케팅 · M05 D02</text>
  <text x="104" y="207" class="title">마케팅 Gem의 실패 기준</text>
  <text x="106" y="288" text-anchor="start" class="subtitle" fill="#625A6B">근거 없는 효능이나 수치를 만들면 멈추고 확인 질문을 해야 한다.</text>
