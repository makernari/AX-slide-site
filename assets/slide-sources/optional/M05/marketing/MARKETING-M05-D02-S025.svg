    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E6614F"/><stop offset="1" stop-color="#7357C8"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#E6614F" stop-opacity=".22"/><stop offset=".72" stop-color="#E6614F" stop-opacity=".05"/><stop offset="1" stop-color="#E6614F" stop-opacity="0"/></radialGradient>
