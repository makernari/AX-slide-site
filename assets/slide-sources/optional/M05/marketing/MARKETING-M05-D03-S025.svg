<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1152" viewBox="0 0 2048 1152">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBFCFE"/><stop offset="1" stop-color="#F1F4FA"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E6614F"/><stop offset="1" stop-color="#7357C8"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#E6614F" stop-opacity=".22"/><stop offset=".72" stop-color="#E6614F" stop-opacity=".05"/><stop offset="1" stop-color="#E6614F" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#16213A" flood-opacity=".12"/></filter>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#16213A" flood-opacity=".10"/></filter>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#9DABC1" opacity=".18"/></pattern>
  </defs>
  <rect width="2048" height="1152" fill="url(#bg)"/>
  <rect width="2048" height="1152" fill="url(#dots)"/>
  <circle cx="1882" cy="142" r="270" fill="url(#halo)"/>
  <style>
    .meta{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:25px;font-weight:800;letter-spacing:1px}
    .title{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:80px;font-weight:900;letter-spacing:-3px;fill:#201D2C}
    .subtitle{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:31px;font-weight:650;letter-spacing:-.8px;fill:#625A6B}
    .label{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:31px;font-weight:850;letter-spacing:-1px}
    .final{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:36px;font-weight:900;letter-spacing:-1px}
    .core{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:29px;font-weight:850;letter-spacing:-.8px}
    .small{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:23px;font-weight:650;letter-spacing:-.4px}
    .step{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:20px;font-weight:900;letter-spacing:1px}
    .ghost{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:64px;font-weight:900;opacity:.13}
  </style>
  <rect x="104" y="60" width="154" height="48" rx="24" fill="url(#brand)"/>
  <text x="181" y="93" text-anchor="middle" class="meta" fill="#FFFFFF">심화 자료</text>
  <text x="1944" y="93" text-anchor="end" class="meta" fill="#E6614F">마케팅 · M05 D03</text>
  <text x="104" y="207" class="title">브랜드 가이드를 지식원으로 다루기</text>
  <text x="106" y="288" text-anchor="start" class="subtitle" fill="#625A6B">버전과 적용 채널이 확인된 가이드만 현재 기준으로 사용한다.</text>
  <path d="M938 485h72M1038 485h72M938 769h72M1038 769h72M1024 523v208" stroke="#E6614F" stroke-width="6" stroke-linecap="round" opacity=".35"/><g filter="url(#softShadow)"><rect x="160" y="390" width="778" height="190" rx="34" fill="#FFFFFF" stroke="#DFE5EF" stroke-width="2"/></g><circle cx="256" cy="485" r="56" fill="#FCEAE6"/><g transform="translate(214 443) scale(0.84)"><path d="M22 9h44l16 17v65H22z" fill="none" stroke="#E6614F" stroke-width="7" stroke-linejoin="round"/><path d="M66 9v19h16M37 48h30M37 66h30" stroke="#7357C8" stroke-width="7" stroke-linecap="round"/></g><text x="348" y="495" class="label" fill="#201D2C">가이드 버전</text><text x="876" y="501" text-anchor="end" class="ghost" fill="#E6614F">01</text><g filter="url(#softShadow)"><rect x="1110" y="390" width="778" height="190" rx="34" fill="#FFFFFF" stroke="#DFE5EF" stroke-width="2"/></g><circle cx="1206" cy="485" r="56" fill="#F0ECFA"/><g transform="translate(1164 443) scale(0.84)"><path d="M9 49L91 14 66 91 48 59z" fill="none" stroke="#7357C8" stroke-width="7" stroke-linejoin="round"/><path d="M48 59L91 14" stroke="#E6614F" stroke-width="7" stroke-linecap="round"/></g><text x="1298" y="495" class="label" fill="#201D2C">적용 채널</text><text x="1826" y="501" text-anchor="end" class="ghost" fill="#7357C8">02</text><g filter="url(#softShadow)"><rect x="160" y="674" width="778" height="190" rx="34" fill="#FFFFFF" stroke="#DFE5EF" stroke-width="2"/></g><circle cx="256" cy="769" r="56" fill="#FCEAE6"/><g transform="translate(214 727) scale(0.84)"><rect x="15" y="22" width="62" height="68" rx="14" fill="none" stroke="#E6614F" stroke-width="7"/><path d="M31 45h30M31 62h22" stroke="#E6614F" stroke-width="7" stroke-linecap="round"/><path d="M80 5l7 16 16 7-16 7-7 16-7-16-16-7 16-7z" fill="#7357C8"/></g><text x="348" y="779" class="label" fill="#201D2C">금지 표현</text><text x="876" y="785" text-anchor="end" class="ghost" fill="#E6614F">03</text><g filter="url(#softShadow)"><rect x="1110" y="674" width="778" height="190" rx="34" fill="#FFFFFF" stroke="#DFE5EF" stroke-width="2"/></g><circle cx="1206" cy="769" r="56" fill="#F0ECFA"/><g transform="translate(1164 727) scale(0.84)"><circle cx="50" cy="50" r="39" fill="none" stroke="#7357C8" stroke-width="7"/><path d="M29 50l14 14 29-34" fill="none" stroke="#E6614F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1298" y="779" class="label" fill="#201D2C">현재 기준</text><text x="1826" y="785" text-anchor="end" class="ghost" fill="#7357C8">04</text><circle cx="1024" cy="627" r="92" fill="url(#brand)" filter="url(#shadow)"/><path d="M987 627l24 24 50-58" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>