  <text x="1944" y="93" text-anchor="end" class="meta" fill="#E6614F">마케팅 · M05 D02</text>
  <text x="104" y="207" class="title">콘텐츠 아이디어를 상태판으로 바꾸기</text>
  <text x="106" y="288" text-anchor="start" class="subtitle" fill="#625A6B">아이디어·확정·보류·발행을 분리하면 제작 흐름이 선명해진다.</text>
