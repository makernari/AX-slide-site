  <rect x="104" y="60" width="154" height="48" rx="24" fill="url(#brand)"/>
  <text x="181" y="93" text-anchor="middle" class="meta" fill="#FFFFFF">선택 자료</text>
  <text x="1944" y="93" text-anchor="end" class="meta" fill="#3157D5">경영지원 · M05 D02</text>
  <text x="104" y="207" class="title">회의 결과를 상태판으로 바꾸기</text>
  <text x="106" y="288" text-anchor="start" class="subtitle" fill="#536078">결정·담당·기한·대기를 분리하면 후속 업무가 선명해진다.</text>
  <g filter="url(#shadow)"><rect x="654" y="375" width="740" height="190" rx="48" fill="url(#brand)"/></g><g transform="translate(742 420) scale(1)"><circle cx="50" cy="50" r="35" fill="none" stroke="#FFFFFF" stroke-width="7"/><circle cx="50" cy="50" r="12" fill="#FFFFFF"/><path d="M50 7v13M50 80v13M7 50h13M80 50h13" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/></g><text x="1080" y="485" text-anchor="middle" class="final" fill="#FFFFFF">결정</text><path d="M1024 565v68M459 633h1130M459 633v57M1024 633v57M1589 633v57" fill="none" stroke="#3157D5" stroke-width="8" stroke-linecap="round" opacity=".72"/><g filter="url(#softShadow)"><rect x="220" y="690" width="478" height="180" rx="34" fill="#FFFFFF" stroke="#DFE5EF" stroke-width="2"/></g><circle cx="312" cy="780" r="52" fill="#EDF3FC"/><g transform="translate(273 741) scale(0.78)"><circle cx="50" cy="33" r="18" fill="none" stroke="#3157D5" stroke-width="7"/><path d="M18 88c4-24 17-34 32-34s28 10 32 34" fill="none" stroke="#3157D5" stroke-width="7" stroke-linecap="round"/><path d="M64 69l9 9 17-21" fill="none" stroke="#14A89A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="522.5" y="790" text-anchor="middle" class="label" fill="#10182B">담당</text><g filter="url(#softShadow)"><rect x="825" y="690" width="478" height="180" rx="34" fill="#FFFFFF" stroke="#DFE5EF" stroke-width="2"/></g><circle cx="917" cy="780" r="52" fill="#EDF3FC"/><g transform="translate(878 741) scale(0.78)"><circle cx="50" cy="50" r="40" fill="none" stroke="#3157D5" stroke-width="7"/><path d="M50 24v29l20 12" fill="none" stroke="#14A89A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1127.5" y="790" text-anchor="middle" class="label" fill="#10182B">기한</text><g filter="url(#softShadow)"><rect x="1430" y="690" width="478" height="180" rx="34" fill="#FFFFFF" stroke="#14A89A" stroke-width="5"/></g><circle cx="1522" cy="780" r="52" fill="#EAF8F5"/><g transform="translate(1483 741) scale