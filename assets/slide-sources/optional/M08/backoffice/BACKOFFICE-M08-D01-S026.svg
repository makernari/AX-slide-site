  <text x="1944" y="93" text-anchor="end" class="meta" fill="#3157D5">경영지원 · M08 D01</text>
  <text x="104" y="207" class="title">업무 요청 분류기 PoC</text>
  <text x="106" y="288" text-anchor="start" class="subtitle" fill="#536078">요청 유형·긴급도·담당 후보를 분리해 검토 가능한 초안을 만든다.</text>
