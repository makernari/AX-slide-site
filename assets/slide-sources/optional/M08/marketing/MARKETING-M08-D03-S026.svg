<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1152" viewBox="0 0 2048 1152">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBFCFE"/><stop offset="1" stop-color="#F1F4FA"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E6614F"/><stop offset="1" stop-color="#7357C8"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#E6614F" stop-opacity=".22"/><stop offset=".72" stop-color="#E6614F" stop-opacity=".05"/><stop offset="1" stop-color="#E6614F" stop-opacity="0"/></radialGradient>
    <linearGradient id="heroShade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#10182B" stop-opacity="0"/><stop offset="1" stop-color="#10182B" stop-opacity=".76"/></linearGradient>
    <clipPath id="heroClip"><rect x="104" y="370" width="1840" height="550" rx="48"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#16213A" flood-opacity=".12"/></filter>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#16213A" flood-opacity=".10"/></filter>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#9DABC1" opacity=".18"/></pattern>
  </defs>
  <rect width="2048" height="1152" fill="url(#bg)"/>
  <rect width="2048" height="1152" fill="url(#dots)"/>
  <circle cx="1882" cy="142" r="270" fill="url(#halo)"/>
  <style>
    .meta{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:25px;font-weight:800;letter-spacing:1px}
    .title{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:80px;font-weight:900;letter-spacing:-3px;fill:#201D2C}
    .subtitle{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:31px;font-weight:650;letter-spacing:-.8px;fill:#625A6B}
    .label{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:31px;font-weight:850;letter-spacing:-1px}
    .final{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:36px;font-weight:900;letter-spacing:-1px}
    .core{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:29px;font-weight:850;letter-spacing:-.8px}
    .small{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:23px;font-weight:650;letter-spacing:-.4px}
    .step{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:20px;font-weight:900;letter-spacing:1px}
    .ghost{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:64px;font-weight:900;opacity:.13}
  </style>
  <rect x="104" y="60" width="154" height="48" rx="24" fill="url(#brand)"/>
  <text x="181" y="93" text-anchor="middle" class="meta" fill="#FFFFFF">예비 자료</text>
  <text x="1944" y="93" text-anchor="end" class="meta" fill="#E6614F">마케팅 · M08 D03</text>
  <text x="104" y="207" class="title">브랜드 밖 질문의 안전한 답변</text>
  <text x="106" y="288" text-anchor="start" class="subtitle" fill="#625A6B">등록된 자료의 범위를 밝히고 브랜드 담당자나 승인 가이드로 연결한다.</text>
  <g filter="url(#shadow)"><rect x="654" y="375" width="740" height="190" rx="48" fill="url(#brand)"/></g><g transform="translate(742 420) scale(1)"><path d="M22 9h44l16 17v65H22z" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/><path d="M66 9v19h16M37 48h30M37 66h30" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/></g><text x="1080" y="485" text-anchor="middle" class="final" fill="#FFFFFF">자료 범위</text><path d="M1024 565v68M459 633h1130M459 633v57M1024 633v57M1589 633v57" fill="none" stroke="#E6614F" stroke-width="8" stroke-linecap="round" opacity=".72"/><g filter="url(#softShadow)"><rect x="220" y="690" width="478" height="180" rx="34" fill="#FFFFFF" stroke="#DFE5EF" stroke-width="2"/></g><circle cx="312" cy="780" r="52" fill="#FCEAE6"/><g transform="translate(273 741) scale(0.78)"><path d="M12 17h76v56H50L28 91V73H12z" fill="none" stroke="#E6614F" stroke-width="7" stroke-linejoin="round"/><path d="M31 42h38M31 57h25" stroke="#7357C8" stroke-width="7" stroke-linecap="round"/></g><text x="522.5" y="790" text-anchor="middle" class="label" fill="#201D2C">답변 제한</text><g filter="url(#softShadow)"><rect x="825" y="690" width="478" height="180" rx="34" fill="#FFFFFF" stroke="#DFE5EF" stroke-width="2"/></g><circle cx="917" cy="780" r="52" fill="#FCEAE6"/><g transform="translate(878 741) scale(0.78)"><circle cx="50" cy="33" r="18" fill="none" stroke="#E6614F" stroke-width="7"/><path d="M18 88c4-24 17-34 32-34s28 10 32 34" fill="none" stroke="#E6614F" stroke-width="7" stroke-linecap="round"/><path d="M64 69l9 9 17-21" fill="none" stroke="#7357C8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1127.5" y="790" text-anchor="middle" class="label" fill="#201D2C">담당자</text><g filter="url(#softShadow)"><rect x="1430" y="690" width="478" height="180" rx="34" fill="#FFFFFF" stroke="#7357C8" stroke-width="5"/></g><circle cx="1522" cy="780" r="52" fill="#F0ECFA"/><g transform="translate(1483 741) scale(0.78)"><circle cx="50" cy="33" r="18" fill="none" stroke="#7357C8" stroke-width="7"/><path d="M18 88c4-24 17-34 32-34s28 10 32 34" fill="none" stroke="#7357C8" stroke-width="7" stroke-linecap="round"/><path d="M64 69l9 9 17-21" fill="none" stroke="#7357C8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1732.5" y="790" text-anchor="middle" class="label" fill="#201D2C">승인 가이드</text>
</svg>