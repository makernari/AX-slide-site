  <text x="104" y="207" class="title">Vrew와 Suno는 한 제작선의 두 역할이다</text>
  <text x="106" y="288" text-anchor="start" class="subtitle" fill="#536078">Vrew는 음성·자막·장면 편집과 최종 내보내기를, Suno는 음악 제작을 담당한다.</text>
